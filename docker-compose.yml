
services:
  airflow:
    image: apache/airflow:2.10.5
    container_name: traffic-accident-airflow
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: "traffic-accident-demo-key"
      AIRFLOW_ADMIN_USERNAME: airflow
      AIRFLOW_ADMIN_PASSWORD: airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username airflow --password airflow
      --firstname Demo --lastname Admin --role Admin --email airflow@example.com || true) &&
      airflow scheduler & airflow webserver"
    restart: unless-stopped
